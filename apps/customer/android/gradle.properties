
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED

android.useAndroidX=true

# Gradle build performance
org.gradle.caching=true
org.gradle.parallel=true

# Keep incremental disabled on Windows cross-drive pub cache (C: vs D:)
kotlin.incremental=false

# Flutter migration settings
android.builtInKotlin=false
android.newDsl=false
