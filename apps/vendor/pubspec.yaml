name: vendor
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  core:
    path: ../../packages/core
  api:
    path: ../../packages/api
  data:
    path: ../../packages/data

  go_router: ^17.2.3
  ui_kit: any

  lucide_icons_flutter: any
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  flutter_map: ^8.3.0
  latlong2: ^0.10.1
  image_picker: ^1.2.2
  file_picker: ^12.0.0-beta.7
  cached_network_image: ^3.4.1
  dio: ^5.9.2
  intl: ^0.20.2
  flutter_secure_storage: ^11.0.0
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  google_sign_in: ^7.2.0
  package_info_plus: ^10.2.1
  jwt_decoder: ^2.0.1
  built_value: ^8.12.6
  flutter_sound: ^9.30.0
  permission_handler: ^13.0.0
  path_provider: ^2.1.5

  easy_localization: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.0
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/launcher_icon.png
    - assets/logo_without_background.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/launcher_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/launcher_icon.png"

