
name: App Builds

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'backend/**'
  pull_request:
    paths-ignore:
      - 'backend/**'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: app-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:


  detect-changes:
    name: Detect Changed Apps
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
      all_apps_changed: ${{ steps.set-matrix.outputs.all_apps_changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.event.repository.default_branch }}
          filters: |
            vendor:
              - 'apps/vendor/**'
              - 'packages/**'
              - 'shared/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
              - 'melos.yaml'
              - '.metadata'
              - '.github/workflows/**'

            driver:
              - 'apps/driver/**'
              - 'packages/**'
              - 'shared/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
              - 'melos.yaml'
              - '.metadata'
              - '.github/workflows/**'

            customer:
              - 'apps/customer/**'
              - 'packages/**'
              - 'shared/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
              - 'melos.yaml'
              - '.metadata'
              - '.github/workflows/**'

      - name: Check existing release assets
        id: release-assets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: latest-apk-build
        shell: bash
        run: |
          set -euo pipefail

          if RELEASE_JSON=$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>/dev/null); then

            echo "Existing release found."

            ASSETS=$(jq -r '.assets[].name' <<< "$RELEASE_JSON")

            for app in vendor driver customer; do
              APK="otlob-${app}.apk"

              if grep -Fxq "$APK" <<< "$ASSETS"; then
                echo "${app}=false" >> "$GITHUB_OUTPUT"
                echo "Found existing APK: $APK"
              else
                echo "${app}=true" >> "$GITHUB_OUTPUT"
                echo "Missing APK: $APK"
              fi
            done

          else
            echo "No existing release found. Building all apps."

            echo "vendor=true" >> "$GITHUB_OUTPUT"
            echo "driver=true" >> "$GITHUB_OUTPUT"
            echo "customer=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate dynamic build matrix
        id: set-matrix
        shell: bash
        env:
          VENDOR: ${{ steps.filter.outputs.vendor }}
          DRIVER: ${{ steps.filter.outputs.driver }}
          CUSTOMER: ${{ steps.filter.outputs.customer }}

          RELEASE_VENDOR: ${{ steps.release-assets.outputs.vendor }}
          RELEASE_DRIVER: ${{ steps.release-assets.outputs.driver }}
          RELEASE_CUSTOMER: ${{ steps.release-assets.outputs.customer }}
        run: |
          set -euo pipefail

          VENDOR="${VENDOR:-false}"
          DRIVER="${DRIVER:-false}"
          CUSTOMER="${CUSTOMER:-false}"

          # Build apps missing from the existing release.
          if [ "$RELEASE_VENDOR" = "true" ]; then
            VENDOR=true
          fi

          if [ "$RELEASE_DRIVER" = "true" ]; then
            DRIVER=true
          fi

          if [ "$RELEASE_CUSTOMER" = "true" ]; then
            CUSTOMER=true
          fi

          # Determine whether all three apps actually changed.
          ALL_CHANGED=false

          if [ \
            "${{ steps.filter.outputs.vendor }}" = "true" ] && [ \
            "${{ steps.filter.outputs.driver }}" = "true" ] && [ \
            "${{ steps.filter.outputs.customer }}" = "true" ]; then
            ALL_CHANGED=true
          fi

          MATRIX=$(jq -cn \
            --arg vendor "$VENDOR" \
            --arg driver "$DRIVER" \
            --arg customer "$CUSTOMER" \
            '{
              include: [
                (if $vendor == "true" then {
                  app_job_name: "otlob-vendor",
                  app_path: "apps/vendor"
                } else empty end),

                (if $driver == "true" then {
                  app_job_name: "otlob-driver",
                  app_path: "apps/driver"
                } else empty end),

                (if $customer == "true" then {
                  app_job_name: "otlob-customer",
                  app_path: "apps/customer"
                } else empty end)
              ]
            }')

          echo "Build matrix: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "all_apps_changed=$ALL_CHANGED" >> "$GITHUB_OUTPUT"

          if [ "$(jq '.include | length' <<< "$MATRIX")" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No apps need rebuilding."
          fi


  build-android-apps:
    name: ${{ matrix.app_job_name }}
    needs: detect-changes

    if: needs.detect-changes.outputs.has_changes == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
          pub-cache: true

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            for candidate in \
              "/usr/local/lib/android/sdk" \
              "$HOME/Android/Sdk"; do
              if [ -d "$candidate" ]; then
                SDK_ROOT="$candidate"
                break
              fi
            done
          fi

          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK directory not found." >&2
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $SDK_ROOT." >&2
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android NDK with retry
        shell: bash
        run: |
          set -euo pipefail

          NDK_VERSION="28.2.13676358"
          NDK_DIRECTORY="$ANDROID_HOME/ndk/$NDK_VERSION"

          if [ -d "$NDK_DIRECTORY" ]; then
            echo "NDK $NDK_VERSION is already installed."
          else
            for attempt in 1 2 3; do
              echo "Installing NDK (attempt $attempt/3)..."

              if sdkmanager --install "ndk;$NDK_VERSION" && \
                 [ -d "$NDK_DIRECTORY" ]; then
                echo "NDK installation succeeded."
                break
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "ERROR: NDK installation failed." >&2
                exit 1
              fi

              sleep 15
            done
          fi

      - name: Install CMake with retry
        shell: bash
        run: |
          set -euo pipefail

          CMAKE_VERSION="3.22.1"
          CMAKE_DIRECTORY="$ANDROID_HOME/cmake/$CMAKE_VERSION"

          if [ -d "$CMAKE_DIRECTORY" ]; then
            echo "CMake $CMAKE_VERSION is already installed."
            exit 0
          fi

          for attempt in 1 2 3; do
            echo "Installing CMake (attempt $attempt/3)..."

            if sdkmanager --install "cmake;$CMAKE_VERSION" && \
               [ -d "$CMAKE_DIRECTORY" ]; then
              echo "CMake installation succeeded."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 5))"
            fi
          done

          echo "ERROR: CMake installation failed." >&2
          exit 1

      - name: Build release APK
        working-directory: ${{ matrix.app_path }}
        env:
          APP_NAME: ${{ matrix.app_job_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f .env-example ]; then
            cp .env-example .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

          flutter build apk --release

          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          OUTPUT_PATH="build/app/outputs/flutter-apk/${APP_NAME}.apk"

          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: Release APK was not created." >&2
            exit 1
          fi

          cp "$APK_PATH" "$OUTPUT_PATH"

          echo "Successfully built $OUTPUT_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app_job_name }}-apk
          path: ${{ matrix.app_path }}/build/app/outputs/flutter-apk/${{ matrix.app_job_name }}.apk
          if-no-files-found: error
          retention-days: 7


  release:
    name: Update Current APK Release

    needs:
      - detect-changes
      - build-android-apps

    if: |
      github.event_name == 'push' &&
      needs.detect-changes.outputs.has_changes == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    concurrency:
      group: latest-apk-release
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          
      - name: Download newly built APKs
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: "*-apk"
          merge-multiple: true

      - name: Verify APK artifacts
        env:
          MATRIX_JSON: ${{ needs.detect-changes.outputs.matrix }}
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_COUNT=$(jq '.include | length' <<< "$MATRIX_JSON")

          for app in $(jq -r '.include[].app_job_name' <<< "$MATRIX_JSON"); do
            APK="release-artifacts/${app}.apk"

            if [ ! -s "$APK" ]; then
              echo "ERROR: Missing or empty APK: $APK" >&2
              exit 1
            fi

            echo "Verified: $APK"
            ls -lh "$APK"
          done

          ACTUAL_COUNT=$(find release-artifacts \
            -maxdepth 1 -type f -name '*.apk' | wc -l)

          if [ "$ACTUAL_COUNT" -ne "$EXPECTED_COUNT" ]; then
            echo "ERROR: Expected $EXPECTED_COUNT APKs, found $ACTUAL_COUNT." >&2
            exit 1
          fi

      - name: Generate release notes
        env:
          MATRIX_JSON: ${{ needs.detect-changes.outputs.matrix }}
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "Automated Android APK release."
            echo
            echo "**Branch:** $GITHUB_REF_NAME"
            echo
            echo "**Commit:** $GITHUB_SHA"
            echo
            echo "**Updated apps:**"

            jq -r '.include[].app_job_name | "- " + .' \
              <<< "$MATRIX_JSON"

          } > release-notes.md

      - name: Delete existing release
        if: needs.detect-changes.outputs.all_apps_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: latest-apk-build
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "All three apps changed."
            echo "Deleting existing release and tag..."

            gh release delete "$RELEASE_TAG" \
              --yes \
              --cleanup-tag

            echo "Old release deleted successfully."
          else
            echo "No existing release to delete."
          fi

      - name: Create new release or update existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: latest-apk-build
          MATRIX_JSON: ${{ needs.detect-changes.outputs.matrix }}
          ALL_APPS_CHANGED: ${{ needs.detect-changes.outputs.all_apps_changed }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$ALL_APPS_CHANGED" = "true" ]; then

            echo "Creating a completely new release..."

            gh release create "$RELEASE_TAG" \
              release-artifacts/*.apk \
              --target "$GITHUB_SHA" \
              --title "Latest Android APKs" \
              --notes-file release-notes.md \
              --latest

            echo "New release created successfully."

          elif gh release view "$RELEASE_TAG" >/dev/null 2>&1; then

            echo "Updating existing release..."
            echo "Only newly built APKs will be replaced."

            # --clobber replaces matching assets only.
            # Other existing APKs remain untouched.
            gh release upload "$RELEASE_TAG" \
              release-artifacts/*.apk \
              --clobber

            gh release edit "$RELEASE_TAG" \
              --title "Latest Android APKs" \
              --notes-file release-notes.md

            # Move the existing release tag to this commit.
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
              -f sha="$GITHUB_SHA" \
              -F force=true

            echo "Existing release updated successfully."

          else

            echo "No existing release found."
            echo "Creating the initial release..."

            gh release create "$RELEASE_TAG" \
              release-artifacts/*.apk \
              --target "$GITHUB_SHA" \
              --title "Latest Android APKs" \
              --notes-file release-notes.md \
              --latest

            echo "Initial release created successfully."

          fi

      - name: Verify final release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: latest-apk-build
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking final release..."

          RELEASE_JSON=$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")

          ASSETS=$(jq -r '.assets[].name' <<< "$RELEASE_JSON")

          for app in vendor driver customer; do
            APK="otlob-${app}.apk"

            if ! grep -Fxq "$APK" <<< "$ASSETS"; then
              echo "ERROR: Missing release asset: $APK" >&2
              exit 1
            fi

            echo "Verified release asset: $APK"
          done

          echo "All three APKs are available in the current release."
          echo "Release URL: $(jq -r '.html_url' <<< "$RELEASE_JSON")"
