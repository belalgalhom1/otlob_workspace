name: App Builds

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

permissions:
  contents: write

concurrency:
  group: app-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apps:
    name: ${{ matrix.app_job_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - app_job_name: otlob-vendor
            app_path: apps/vendor
          - app_job_name: otlob-driver
            app_path: apps/driver
          - app_job_name: otlob-customer
            app_path: apps/customer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve workspace dependencies
        run: dart pub get

      - name: Prepare environment
        working-directory: ${{ matrix.app_path }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f .env-example ]; then
            cp .env-example .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Build release APK
        working-directory: ${{ matrix.app_path }}
        env:
          APP_NAME: ${{ matrix.app_job_name }}
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk --release --no-pub

          cp build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/${APP_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app_job_name }}-apk
          path: ${{ matrix.app_path }}/build/app/outputs/flutter-apk/${{ matrix.app_job_name }}.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: release
    needs: build-android-apps
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: '*-apk'
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}-${{ github.run_attempt }}
          name: "APK Build"
          body: |
            Automated APK release generated by GitHub Actions.

            Commit: ${{ github.sha }}
          files: release-artifacts/*.apk
          prerelease: false
          make_latest: true

      - name: Delete old automated APK releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CURRENT_TAG: apk-build-${{ github.run_number }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail

          gh release list --limit 1000 --json tagName --jq '.[].tagName' |
          while IFS= read -r tag; do
            [[ "$tag" == apk-build-* ]] || continue
            [[ "$tag" == "$CURRENT_TAG" ]] && continue

            echo "Deleting old release: $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
