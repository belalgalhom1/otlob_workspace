
name: App Builds

on:
  push:
    branches:
      - main
      - master
      - develop
    paths-ignore:
      - 'backend/**'
  pull_request:
    paths-ignore:
      - 'backend/**'

permissions:
  contents: write

concurrency:
  group: app-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  determine-apps:
    name: Determine Apps to Build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      apps_built: ${{ steps.set-matrix.outputs.apps_built }}
    steps:
      - name: Parse commit message for app tags
        id: set-matrix
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title || '' }}
        shell: bash
        run: |
          MSG="$COMMIT_MSG"
          LOWER_MSG=$(echo "$MSG" | tr '[:upper:]' '[:lower:]')

          BUILD_CUSTOMER=false
          BUILD_DRIVER=false
          BUILD_VENDOR=false

          if [[ "$LOWER_MSG" == *"[customer]"* ]]; then BUILD_CUSTOMER=true; fi
          if [[ "$LOWER_MSG" == *"[driver]"* ]]; then BUILD_DRIVER=true; fi
          if [[ "$LOWER_MSG" == *"[vendor]"* ]]; then BUILD_VENDOR=true; fi

          # If no app tag is specified, build all 3 apps by default
          if [ "$BUILD_CUSTOMER" = false ] && [ "$BUILD_DRIVER" = false ] && [ "$BUILD_VENDOR" = false ]; then
            BUILD_CUSTOMER=true
            BUILD_DRIVER=true
            BUILD_VENDOR=true
          fi

          ITEMS=()
          BUILT_NAMES=()

          if [ "$BUILD_VENDOR" = true ]; then
            ITEMS+=('{"app_job_name":"otlob-vendor","app_path":"apps/vendor"}')
            BUILT_NAMES+=("Vendor")
          fi
          if [ "$BUILD_DRIVER" = true ]; then
            ITEMS+=('{"app_job_name":"otlob-driver","app_path":"apps/driver"}')
            BUILT_NAMES+=("Driver")
          fi
          if [ "$BUILD_CUSTOMER" = true ]; then
            ITEMS+=('{"app_job_name":"otlob-customer","app_path":"apps/customer"}')
            BUILT_NAMES+=("Customer")
          fi

          IFS=,
          MATRIX_JSON="{\"include\":[${ITEMS[*]}]}"
          unset IFS

          echo "Apps selected: ${BUILT_NAMES[*]}"
          echo "Generated matrix: $MATRIX_JSON"
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"
          echo "apps_built=${BUILT_NAMES[*]}" >> "$GITHUB_OUTPUT"

  build-android-apps:
    name: ${{ matrix.app_job_name }}
    needs: determine-apps
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.determine-apps.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      
      - name: Install Android NDK with retry
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            for candidate in \
              "$RUNNER_TEMP/android-sdk" \
              "/usr/local/lib/android/sdk" \
              "$HOME/Android/Sdk"
            do
              if [ -d "$candidate/cmdline-tools" ] && \
                 [ -d "$candidate/platform-tools" ]; then
                SDK_ROOT="$candidate"
                break
              fi
            done
          fi

          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Could not locate the Android SDK."
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found in $SDK_ROOT/cmdline-tools"
            exit 1
          fi

          NDK_VERSION="28.2.13676358"
          NDK_PACKAGE="ndk;$NDK_VERSION"
          NDK_DIRECTORY="$SDK_ROOT/ndk/$NDK_VERSION"

          echo "Android SDK: $SDK_ROOT"
          echo "SDK manager: $SDKMANAGER"

          if [ -d "$NDK_DIRECTORY" ]; then
            echo "NDK $NDK_VERSION is already installed."
            exit 0
          fi

          for attempt in 1 2 3; do
            echo "Installing NDK $NDK_VERSION (attempt $attempt/3)..."

            if "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
              --install "$NDK_PACKAGE" &&
              [ -d "$NDK_DIRECTORY" ]; then
              echo "NDK $NDK_VERSION installed successfully."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Installation failed. Retrying in 15 seconds..."
              sleep 15
            fi
          done

          echo "ERROR: NDK installation failed after 3 attempts."
          exit 1

      - name: Prepare environment
        working-directory: ${{ matrix.app_path }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f .env-example ]; then
            cp .env-example .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Build release APK
        working-directory: ${{ matrix.app_path }}
        env:
          APP_NAME: ${{ matrix.app_job_name }}
        shell: bash
        run: |
          set -euo pipefail
      
          flutter build apk --release
      
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          OUTPUT_PATH="build/app/outputs/flutter-apk/${APP_NAME}.apk"
      
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Expected APK was not created: $APK_PATH"
            exit 1
          fi
      
          cp "$APK_PATH" "$OUTPUT_PATH"
          echo "Created APK: $OUTPUT_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app_job_name }}-apk
          path: ${{ matrix.app_path }}/build/app/outputs/flutter-apk/${{ matrix.app_job_name }}.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    needs: [determine-apps, build-android-apps]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: "*-apk"
          merge-multiple: true

      - name: Verify APK artifacts
        shell: bash
        run: |
          set -euo pipefail

          count=$(ls -1 release-artifacts/*.apk 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "ERROR: No APK artifacts found in release-artifacts directory" >&2
            exit 1
          fi

          for apk in release-artifacts/*.apk; do
            if [ ! -s "$apk" ]; then
              echo "ERROR: Missing or empty APK: $apk" >&2
              exit 1
            fi
            ls -lh "$apk"
          done

      - name: Publish or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: "apk-latest"
          APPS_BUILT: ${{ needs.determine-apps.outputs.apps_built }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TITLE="Latest APK Builds"

          # Generate release notes safely with full indentation
          printf "Automated APK release generated by GitHub Actions.\n\n" > release-notes.md
          printf -- "- **Branch:** \`%s\`\n" "${{ github.ref_name }}" >> release-notes.md
          printf -- "- **Commit:** [View commit](https://github.com/%s/commit/%s)\n" "${{ github.repository }}" "${{ github.sha }}" >> release-notes.md
          printf -- "- **Updated apps:** %s\n" "$APPS_BUILT" >> release-notes.md
          printf -- "- **Last updated:** %s\n" "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> release-notes.md

          # If the target release does not exist yet:
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG does not exist. Checking for legacy release assets to preserve..."

            # If an old apk-build-* release exists, download its APKs so unbuilt apps are preserved
            LATEST_OLD_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
            if [ -n "$LATEST_OLD_TAG" ] && [ "$LATEST_OLD_TAG" != "$RELEASE_TAG" ]; then
              echo "Downloading existing assets from legacy release $LATEST_OLD_TAG..."
              gh release download "$LATEST_OLD_TAG" --dir release-artifacts/ --pattern "*.apk" --clobber || true
            fi

            echo "Creating initial $RELEASE_TAG release..."
            gh release create "$RELEASE_TAG" release-artifacts/*.apk \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --latest
          else
            echo "Release $RELEASE_TAG exists. Updating APK assets..."

            for apk in release-artifacts/*.apk; do
              [ -f "$apk" ] || continue
              filename=$(basename "$apk")

              echo "Deleting old $filename from release $RELEASE_TAG (if present)..."
              gh release delete-asset "$RELEASE_TAG" "$filename" --yes 2>/dev/null || true

              echo "Uploading new $filename to release $RELEASE_TAG..."
              gh release upload "$RELEASE_TAG" "$apk" --clobber
            done

            echo "Updating release description..."
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --latest
          fi

      - name: Clean up legacy apk-build releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          gh release list \
            --limit 1000 \
            --json tagName \
            --jq '.[].tagName' |
          while IFS= read -r tag; do
            [[ "$tag" == apk-build-* ]] || continue
            echo "Deleting legacy automated APK release: $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          done
