
name: App Builds

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

permissions:
  contents: write

concurrency:
  group: app-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apps:
    name: ${{ matrix.app_job_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - app_job_name: otlob-vendor
            app_path: apps/vendor
          - app_job_name: otlob-driver
            app_path: apps/driver
          - app_job_name: otlob-customer
            app_path: apps/customer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      
      - name: Install Android NDK with retry
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            for candidate in \
              "$RUNNER_TEMP/android-sdk" \
              "/usr/local/lib/android/sdk" \
              "$HOME/Android/Sdk"
            do
              if [ -d "$candidate/cmdline-tools" ] && \
                 [ -d "$candidate/platform-tools" ]; then
                SDK_ROOT="$candidate"
                break
              fi
            done
          fi

          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Could not locate the Android SDK."
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found in $SDK_ROOT/cmdline-tools"
            exit 1
          fi

          NDK_VERSION="28.2.13676358"
          NDK_PACKAGE="ndk;$NDK_VERSION"
          NDK_DIRECTORY="$SDK_ROOT/ndk/$NDK_VERSION"

          echo "Android SDK: $SDK_ROOT"
          echo "SDK manager: $SDKMANAGER"

          if [ -d "$NDK_DIRECTORY" ]; then
            echo "NDK $NDK_VERSION is already installed."
            exit 0
          fi

          for attempt in 1 2 3; do
            echo "Installing NDK $NDK_VERSION (attempt $attempt/3)..."

            if "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
              --install "$NDK_PACKAGE" &&
              [ -d "$NDK_DIRECTORY" ]; then
              echo "NDK $NDK_VERSION installed successfully."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Installation failed. Retrying in 15 seconds..."
              sleep 15
            fi
          done

          echo "ERROR: NDK installation failed after 3 attempts."
          exit 1

      - name: Resolve workspace dependencies
        run: dart pub get

      - name: Prepare environment
        working-directory: ${{ matrix.app_path }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f .env-example ]; then
            cp .env-example .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Build release APK
        working-directory: ${{ matrix.app_path }}
        env:
          APP_NAME: ${{ matrix.app_job_name }}
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk --release --no-pub

          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          OUTPUT_PATH="build/app/outputs/flutter-apk/${APP_NAME}.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Expected APK was not created: $APK_PATH"
            exit 1
          fi

          cp "$APK_PATH" "$OUTPUT_PATH"
          echo "Created APK: $OUTPUT_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app_job_name }}-apk
          path: ${{ matrix.app_path }}/build/app/outputs/flutter-apk/${{ matrix.app_job_name }}.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: release
    needs: build-android-apps
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: '*-apk'
          merge-multiple: true

      - name: Verify APK artifacts
        shell: bash
        run: |
          set -euo pipefail

          for apk in \
            release-artifacts/otlob-vendor.apk \
            release-artifacts/otlob-driver.apk \
            release-artifacts/otlob-customer.apk
          do
            if [ ! -s "$apk" ]; then
              echo "ERROR: Missing or empty APK: $apk"
              exit 1
            fi

            ls -lh "$apk"
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}-${{ github.run_attempt }}
          name: "APK Build"
          body: |
            Automated APK release generated by GitHub Actions.
            
            **Branch:** `${{ github.ref_name }}`
            **Commit:** [View commit](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          files: |
            release-artifacts/otlob-vendor.apk
            release-artifacts/otlob-driver.apk
            release-artifacts/otlob-customer.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old automated APK releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CURRENT_TAG: apk-build-${{ github.run_number }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail

          gh release list \
            --limit 1000 \
            --json tagName \
            --jq '.[].tagName' |
          while IFS= read -r tag; do
            [[ "$tag" == apk-build-* ]] || continue
            [[ "$tag" == "$CURRENT_TAG" ]] && continue

            echo "Deleting old release: $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
