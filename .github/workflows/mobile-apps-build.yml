name: Automatic App Builds

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

permissions:
  contents: write

jobs:
  build-android-apps:
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_job_name: otlob-vendor
            app_path: apps/vendor
          - app_job_name: otlob-driver
            app_path: apps/driver
          - app_job_name: otlob-customer
            app_path: apps/customer
    name: ${{ matrix.app_job_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ matrix.app_path }}
        run: |
          if [ -f .env-example ]; then
            cp .env-example .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app_job_name }}-apk
          path: ${{ matrix.app_path }}/build/app/outputs/flutter-apk/*.apk

  publish-release:
    name: publish-release
    needs: build-android-apps
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}-${{ github.run_attempt }}
          name: APK Build #${{ github.run_number }}
          body: |
            Automated APK release generated by GitHub Actions.
            Commit: ${{ github.sha }}
          files: release-artifacts/**/*.apk
          prerelease: true
