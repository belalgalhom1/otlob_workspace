# ─────────────────────────────────────────────────────────────
# ws.otlob-egy.online  –  Socket.IO WebSocket Gateway
# ─────────────────────────────────────────────────────────────
# PM2 runs the WS server in cluster mode on :4000.
# Socket.IO uses Redis adapter for cross-instance pub/sub.
#
# Socket.IO negotiation:
#   1) HTTP long-polling handshake  → /socket.io/?EIO=4&transport=polling
#   2) WebSocket upgrade            → /socket.io/?EIO=4&transport=websocket
# ─────────────────────────────────────────────────────────────

# ── Rate & Connection Limiting ───────────────────────────────
limit_req_zone  $binary_remote_addr zone=ws_connect:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=ws_conns:10m;

# ── Upstream (PM2 cluster) ───────────────────────────────────
upstream ws_backend {
    ip_hash;
    server 127.0.0.1:4000;
    keepalive 64;
}

# ── Map for Connection header ────────────────────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP → HTTPS redirect ───────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name ws.otlob-egy.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ─────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ws.otlob-egy.online;

    # ── SSL ───────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/ws.otlob-egy.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ws.otlob-egy.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL_WS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;

    # OCSP Stapling — faster TLS on mobile reconnects
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/ws.otlob-egy.online/chain.pem;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ── Mobile API headers ────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Body size (Socket.IO payloads are small) ─────────────
    client_max_body_size 1m;

    # ── Connection limit per IP ──────────────────────────────
    limit_conn ws_conns 50;

    # ══════════════════════════════════════════════════════════
    # 1) Socket.IO endpoint
    # ══════════════════════════════════════════════════════════
    location /socket.io/ {
        limit_req zone=ws_connect burst=20 nodelay;

        proxy_pass http://ws_backend;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Standard proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived connection timeouts (Socket.IO pings keep alive)
        proxy_connect_timeout   10s;
        proxy_read_timeout      3600s;
        proxy_send_timeout      3600s;

        # Disable buffering for real-time data
        proxy_buffering off;
        proxy_cache off;
    }

    # ══════════════════════════════════════════════════════════
    # 2) Health check / root
    # ══════════════════════════════════════════════════════════
    location / {
        proxy_pass http://ws_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout 10s;
    }
}
