# ─────────────────────────────────────────────────────────────
# api.otlob-egy.online  –  REST API + Static Media
# ─────────────────────────────────────────────────────────────
# PM2 runs the API in cluster mode; all instances listen on :3000.
# Nginx load-balances across them and serves /media/ directly.
# ─────────────────────────────────────────────────────────────

# ── Rate Limiting Zones ──────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_upload:10m  rate=10r/s;

# ── Upstream (PM2 cluster) ───────────────────────────────────
upstream api_backend {
    least_conn;
    server 127.0.0.1:3000;
    keepalive 64;
}

# ── HTTP → HTTPS redirect ───────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.otlob-egy.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ─────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.otlob-egy.online;

    # ── SSL ───────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/api.otlob-egy.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.otlob-egy.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL_API:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;

    # OCSP Stapling — avoids extra round-trip for mobile clients
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/api.otlob-egy.online/chain.pem;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ── Mobile API headers ────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Global client body size (upload cap) ─────────────────
    client_max_body_size 12m;

    # ── Gzip ─────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        application/xml;

    # ══════════════════════════════════════════════════════════
    # 1) Static media – served directly by nginx (no Node hit)
    # ══════════════════════════════════════════════════════════
    location /media/ {
        alias /opt/otlobegy-backend/storage/;

        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;

        autoindex off;

        location ~* \.(php|py|sh|pl|cgi)$ {
            deny all;
        }

        sendfile    on;
        tcp_nopush  on;
        tcp_nodelay on;
    }

    # ══════════════════════════════════════════════════════════
    # 2) Swagger docs
    # ══════════════════════════════════════════════════════════
    location /docs {
        limit_req zone=api_general burst=20 nodelay;

        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # ══════════════════════════════════════════════════════════
    # 3) Auth endpoints – strict rate limit
    # ══════════════════════════════════════════════════════════
    location /auth {
        limit_req zone=api_auth burst=10 nodelay;

        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # ══════════════════════════════════════════════════════════
    # 4) Upload routes – larger timeout
    # ══════════════════════════════════════════════════════════
    location ~* ^/(vendors/.*/logo|vendors/.*/cover|vendors/.*/products/.*/image|chat/.*/media|vendors/.*/categories/.*/icon) {
        limit_req zone=api_upload burst=5 nodelay;

        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        client_body_timeout   60s;
    }

    # ══════════════════════════════════════════════════════════
    # 5) All other API routes
    # ══════════════════════════════════════════════════════════
    location / {
        limit_req zone=api_general burst=40 nodelay;

        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # If a PM2 instance errors, retry on another
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 2;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }
}
